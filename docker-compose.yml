services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      APP_NAME: application
      PUBLIC_API_HOST: 0.0.0.0     # внутри контейнера слушать нужно 0.0.0.0, не localhost
      PUBLIC_API_PORT: 8080
      PG_HOST: postgres            # имя сервиса ниже, docker сам его зарезолвит
      PG_PORT: 5432
      PG_USER: postgres
      PG_PASS: 1234
      PG_DB: platform
      PG_MAX_CONN: 20
      POSTGRES_DSN: postgres://postgres:1234@postgres:5432/platform?sslmode=disable  # нужен cmd/migrator
      JWT_SECRET: replace_me_local_dev_only
    depends_on:
      postgres:
        condition: service_healthy
    # Применить миграции (однократно, после старта postgres):
    #   docker-compose run --rm app ./migrator migrations up

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: platform
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
