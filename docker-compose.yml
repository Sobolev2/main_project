services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      APP_NAME: application
      PUBLIC_API_HOST: 0.0.0.0     # внутри контейнера слушать нужно 0.0.0.0, не localhost
      PUBLIC_API_PORT: 8080
      PG_HOST: postgres           # имя сервиса ниже, docker сам его зарезолвит
      PG_PORT: 5432
      PG_USER: postgres
      PG_PASS: 1234
      PG_DB: platform
      PG_MAX_CONN: 20
      POSTGRES_DSN: postgres://postgres:1234@postgres:5432/platform?sslmode=disable  # нужен cmd/migrator
      JWT_SECRET: replace_me_local_dev_only
    depends_on:
      postgres:
        condition: service_healthy
    # Применить миграции (однократно, после старта postgres):
    #   docker-compose run --rm app ./migrator migrations up

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: platform
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  kafka:
    image: apache/kafka:4.1.0
    container_name: backend-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
volumes:
  pgdata:
