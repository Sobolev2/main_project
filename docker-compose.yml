services:
  app:
    build:
      context: .
      dockerfile: backend-service/Dockerfile
    ports:
      - "8080:8080"
    environment:
      APP_NAME: application
      PUBLIC_API_HOST: 0.0.0.0
      PUBLIC_API_PORT: 8080
      PG_HOST: postgres
      PG_PORT: 5432
      PG_USER: postgres
      PG_PASS: 1234
      PG_DB: platform
      PG_MAX_CONN: 20
      JWT_SECRET: replace_me_local_dev_only
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: kafka:29092
      NOTIFICATION_GRPC_ADDR: notification-service:50051
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
      migrator:
        condition: service_completed_successfully
  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    ports:
      - "127.0.0.1:50051:50051"
    environment:
      APP_NAME: notification-service
      KAFKA_BROKERS: kafka:29092
      POSTGRES_DSN: postgres://postgres:1234@postgres:5432/notifications?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    restart: unless-stopped
  migrator:
    build:
      context: .
      dockerfile: backend-service/Dockerfile
    command: ["./migrator", "migrations", "up"]
    environment:
      POSTGRES_DSN: postgres://postgres:1234@postgres:5432/platform?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: platform
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  kafka:
    image: apache/kafka:4.1.0
    container_name: backend-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

volumes:
  pgdata: